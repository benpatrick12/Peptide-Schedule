<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Peptide</title>

<!-- Home-screen app behavior -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Peptide">
<meta name="theme-color" content="#F1F4F1">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' fill='%23DE7330'/><rect x='256' width='256' height='512' fill='%2311876A'/><circle cx='256' cy='256' r='118' fill='%23ffffff'/><rect x='238' y='190' width='36' height='132' rx='12' fill='%2322302A'/><rect x='190' y='238' width='132' height='36' rx='12' fill='%2322302A'/></svg>">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' fill='%2311876A'/><circle cx='256' cy='256' r='150' fill='%23ffffff'/><rect x='230' y='176' width='52' height='160' rx='16' fill='%2322302A'/><rect x='176' y='230' width='160' height='52' rx='16' fill='%2322302A'/></svg>">

<style>
  :root{
    --canvas:#F1F4F1;
    --surface:#FFFFFF;
    --ink:#16231D;
    --muted:#6E7E76;
    --line:#E2E8E2;
    --r:#11876A;          /* Right side */
    --r-soft:#E0F1EB;
    --l:#DE7330;          /* Left side */
    --l-soft:#FBEADD;
    --rest:#9AA6A0;
    --rest-soft:#EBEEEB;
    --danger:#B23B3B;
    --focus:#1B6FE0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--canvas);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:460px;margin:0 auto;padding:18px 16px calc(64px + env(safe-area-inset-bottom));}

  /* header */
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px;}
  .title{font-size:23px;font-weight:800;letter-spacing:-.01em;}
  .subtitle{font-size:13px;font-weight:500;color:var(--muted);margin-top:3px;}
  .legend{display:flex;gap:14px;margin-top:10px;}
  .legend span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);}
  .swatch{width:11px;height:11px;border-radius:50%;}
  .gear{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface);color:var(--muted);font-size:18px;line-height:1;cursor:pointer;}

  /* settings panel */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;
    margin-bottom:14px;display:flex;flex-direction:column;gap:12px;}
  .panel label{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:6px;}
  .panel input[type=date]{font-size:15px;font-family:inherit;padding:11px;border:1px solid var(--line);
    border-radius:10px;color:var(--ink);background:#fff;}
  .panel .reset{font-size:14px;font-weight:600;font-family:inherit;padding:11px;border-radius:10px;
    border:1px solid var(--line);background:#fff;color:var(--danger);cursor:pointer;}
  .panel .hint{font-size:12px;color:var(--muted);line-height:1.4;}

  /* first-run setup */
  .setup{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px 22px;margin-top:8px;}
  .setup__eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  .setup__title{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:8px 0 10px;}
  .setup__text{font-size:14px;line-height:1.5;color:var(--muted);margin:0 0 18px;}
  .setup__label{display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;margin-bottom:18px;}
  .setup__label input{font-size:16px;font-family:inherit;padding:13px;border:1px solid var(--line);border-radius:12px;}
  .setup__go{width:100%;border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:700;
    font-family:inherit;color:#fff;background:var(--r);cursor:pointer;}

  /* today card */
  .today{border-radius:22px;padding:22px 20px 20px;border:1px solid var(--line);background:var(--surface);}
  .today--r{background:var(--r-soft);border-color:transparent;}
  .today--l{background:var(--l-soft);border-color:transparent;}
  .today--rest{background:var(--rest-soft);border-color:transparent;}
  .eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  .today__big{font-size:44px;line-height:1.02;font-weight:800;letter-spacing:-.025em;margin:7px 0 3px;}
  .today--r .today__big{color:var(--r);}
  .today--l .today__big{color:var(--l);}
  .today--rest .today__big{color:#556;}
  .today__sub{font-size:14px;font-weight:500;color:var(--muted);}
  .pips{display:flex;gap:9px;align-items:center;margin-top:15px;}
  .pip{width:12px;height:12px;border-radius:50%;background:rgba(0,0,0,.11);}
  .today--r .pip--done{background:var(--r);}
  .today--l .pip--done{background:var(--l);}
  .today--r .pip--today{box-shadow:0 0 0 2px var(--r-soft),0 0 0 4px var(--r);}
  .today--l .pip--today{box-shadow:0 0 0 2px var(--l-soft),0 0 0 4px var(--l);}
  .cta{margin-top:17px;width:100%;border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:700;
    font-family:inherit;color:#fff;cursor:pointer;}
  .today--r .cta{background:var(--r);}
  .today--l .cta{background:var(--l);}
  .today button.cta--done{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.6px var(--line);font-weight:600;}

  /* up next */
  .next{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);
    border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px;}
  .next__lbl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  .next__val{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;text-align:right;}
  .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .dot--r{background:var(--r);} .dot--l{background:var(--l);} .dot--rest{background:var(--rest);}

  /* schedule list */
  .cycle{margin-top:20px;}
  .cycle__head{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 8px;}
  .cycle__name{font-size:14px;font-weight:700;}
  .cycle__range{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;
    font-weight:600;color:var(--muted);}
  .cycle__rows{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:5px;
    display:flex;flex-direction:column;gap:3px;}
  .row{display:flex;align-items:center;gap:12px;padding:11px 11px;border-radius:12px;min-height:54px;
    transition:background .15s ease,opacity .15s ease,box-shadow .15s ease;}
  .row[role=button]{cursor:pointer;}
  .row__day{width:60px;flex:none;display:flex;flex-direction:column;gap:2px;line-height:1.05;}
  .row__wd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-weight:600;
    text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
  .row__dt{font-size:15px;font-weight:700;}
  .row__mid{flex:1;}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 11px;border-radius:9px;}
  .badge--r{background:var(--r-soft);color:var(--r);}
  .badge--l{background:var(--l-soft);color:var(--l);}
  .badge--rest{background:var(--rest-soft);color:var(--rest);}
  .row__check{flex:none;}
  .box{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:15px;
    box-shadow:inset 0 0 0 1.7px var(--line);transition:background .15s ease;}
  .row--r .box--on{background:var(--r);box-shadow:none;}
  .row--l .box--on{background:var(--l);box-shadow:none;}
  .row--done .row__day,.row--done .badge{opacity:.5;}
  .row--today{background:#fff;}
  .row--today.row--r{box-shadow:inset 0 0 0 2px var(--r);}
  .row--today.row--l{box-shadow:inset 0 0 0 2px var(--l);}
  .row--today.row--rest{box-shadow:inset 0 0 0 2px var(--rest);}
  .tag-today{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;font-weight:700;
    letter-spacing:.06em;color:var(--ink);}

  .foot{margin-top:24px;text-align:center;font-size:12px;color:var(--muted);line-height:1.5;}

  :focus-visible{outline:2.5px solid var(--focus);outline-offset:2px;}
  [hidden]{display:none!important;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
  <div class="wrap">
    <header id="hdr" hidden>
      <div>
        <div class="title">Peptide Schedule</div>
        <div class="subtitle">5 days on, 2 off &middot; sides alternate each shot</div>
        <div class="legend">
          <span><i class="swatch" style="background:var(--r)"></i>R &middot; Right</span>
          <span><i class="swatch" style="background:var(--l)"></i>L &middot; Left</span>
        </div>
      </div>
      <button class="gear" id="gear" aria-label="Settings">&#9881;</button>
    </header>

    <div class="panel" id="panel" hidden>
      <label>Day 1 of the cycle
        <input type="date" id="startInput">
      </label>
      <div class="hint">Day 1 is your first Right-side shot. Change this only if you set it up on the wrong day.</div>
      <button class="reset" id="resetChecks">Clear all check marks</button>
    </div>

    <div id="app"></div>

    <div class="foot" id="foot" hidden>Saved on this device. No Claude needed.</div>
  </div>

<script>
  const KEY_START = "peptide:startDate:v1";
  const KEY_CHECKS = "peptide:checks:v1";

  // Native device storage (persists on the phone)
  const store = {
    get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
    set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  };

  let startISO = store.get(KEY_START);
  let checks = {};
  try { checks = JSON.parse(store.get(KEY_CHECKS) || "{}"); } catch(e){ checks = {}; }

  // ---- date helpers (local, date-only) ----
  const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const pad = n => String(n).padStart(2,"0");
  const toISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const todayISO = () => toISO(new Date());
  const parseISO = iso => { const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d); };
  const addDays = (iso,n) => { const d=parseISO(iso); d.setDate(d.getDate()+n); return toISO(d); };
  const diffDays = (a,b) => Math.round((parseISO(a)-parseISO(b))/86400000);
  const fmtFull = iso => { const d=parseISO(iso); return `${WD[d.getDay()]}, ${MO[d.getMonth()]} ${d.getDate()}`; };
  const fmtWd = iso => WD[parseISO(iso).getDay()];
  const fmtMd = iso => { const d=parseISO(iso); return `${MO[d.getMonth()]} ${d.getDate()}`; };

  // ---- cycle logic: 5 on / 2 off, side alternates every injection ----
  function action(idx){
    const pos = ((idx % 7) + 7) % 7;
    if(pos >= 5) return { rest:true, restNo: pos - 4 };
    const cycles = Math.floor(idx / 7);
    const injNum = cycles * 5 + (pos + 1);                 // 1st injection ever, 2nd, ...
    const side = (injNum % 2 === 1) ? "Right" : "Left";    // odd = Right
    return { rest:false, side, dayOn: pos + 1 };
  }

  function saveChecks(){ store.set(KEY_CHECKS, JSON.stringify(checks)); }
  function toggle(iso){
    if(checks[iso]) delete checks[iso]; else checks[iso] = true;
    saveChecks();
    render();
  }

  // ---- first-run setup ----
  function renderSetup(){
    document.getElementById("app").innerHTML = `
      <div class="setup">
        <div class="setup__eyebrow">First-time setup</div>
        <h1 class="setup__title">When was Day 1?</h1>
        <p class="setup__text">Pick the day you did your first Right-side shot. Everything else follows the 5-on, 2-off rhythm from there. You can change it later in settings.</p>
        <label class="setup__label">Day 1
          <input type="date" id="setupDate" value="${todayISO()}">
        </label>
        <button class="setup__go" id="setupGo">Start tracking</button>
      </div>`;
    document.getElementById("setupGo").addEventListener("click", () => {
      const v = document.getElementById("setupDate").value || todayISO();
      startISO = v;
      store.set(KEY_START, startISO);
      showMain();
    });
  }

  function showMain(){
    document.getElementById("hdr").removeAttribute("hidden");
    document.getElementById("foot").removeAttribute("hidden");
    render();
  }

  // ---- main render ----
  function render(){
    const tISO = todayISO();
    const tIdx = diffDays(tISO, startISO);
    const app = document.getElementById("app");

    // TODAY
    let todayHTML;
    if(tIdx < 0){
      todayHTML = `<div class="today">
        <div class="eyebrow">Starts ${fmtFull(startISO)}</div>
        <div class="today__big">Not started</div>
        <div class="today__sub">First shot is Right side</div>
      </div>`;
    } else {
      const a = action(tIdx);
      if(a.rest){
        todayHTML = `<div class="today today--rest">
          <div class="eyebrow">Today &middot; ${fmtFull(tISO)}</div>
          <div class="today__big">Rest day</div>
          <div class="today__sub">No injection &middot; off day ${a.restNo} of 2</div>
        </div>`;
      } else {
        const sc = a.side === "Right" ? "r" : "l";
        const done = !!checks[tISO];
        const cStart = Math.floor(tIdx / 7) * 7;
        let pips = "";
        for(let i=0;i<5;i++){
          const di = cStart + i;
          const diso = addDays(startISO, di);
          const cls = (checks[diso] ? "pip--done " : "") + (di === tIdx ? "pip--today" : "");
          pips += `<span class="pip ${cls}"></span>`;
        }
        todayHTML = `<div class="today today--${sc}">
          <div class="eyebrow">Today &middot; ${fmtFull(tISO)}</div>
          <div class="today__big">${a.side} side</div>
          <div class="today__sub">Injection day ${a.dayOn} of 5</div>
          <div class="pips">${pips}</div>
          <button class="cta ${done ? "cta--done":""}" data-date="${tISO}">${done ? "Done &check; &middot; tap to undo" : "Mark today done"}</button>
        </div>`;
      }
    }

    // UP NEXT
    const tomISO = addDays(tISO, 1);
    const tomIdx = tIdx + 1;
    let nextHTML;
    if(tomIdx < 0){
      nextHTML = `<div class="next"><span class="next__lbl">Up next</span>
        <span class="next__val">Starts ${fmtFull(startISO)}</span></div>`;
    } else {
      const an = action(tomIdx);
      if(an.rest){
        nextHTML = `<div class="next"><span class="next__lbl">Up next</span>
          <span class="next__val"><span class="dot dot--rest"></span>${fmtFull(tomISO)} &middot; Rest day</span></div>`;
      } else {
        const sc = an.side === "Right" ? "r" : "l";
        nextHTML = `<div class="next"><span class="next__lbl">Up next</span>
          <span class="next__val"><span class="dot dot--${sc}"></span>${fmtFull(tomISO)} &middot; ${an.side} side</span></div>`;
      }
    }

    // SCHEDULE LIST
    const curCycle = Math.max(0, Math.floor(tIdx / 7));
    const startCycle = Math.max(0, curCycle - 1);
    const endCycle = curCycle + 8;
    let list = "";
    for(let c = startCycle; c <= endCycle; c++){
      const bStart = c * 7;
      const bA = addDays(startISO, bStart);
      const bB = addDays(startISO, bStart + 6);
      let rows = "";
      for(let i=0;i<7;i++){
        const idx = bStart + i;
        const iso = addDays(startISO, idx);
        const a = action(idx);
        const isToday = idx === tIdx;
        const todayTag = isToday ? `<span class="tag-today">TODAY</span>` : "";
        if(a.rest){
          rows += `<div class="row row--rest ${isToday?"row--today":""}">
            <div class="row__day"><span class="row__wd">${fmtWd(iso)}</span><span class="row__dt">${fmtMd(iso)}</span></div>
            <div class="row__mid"><span class="badge badge--rest">Rest day</span> ${todayTag}</div>
            <div class="row__check"></div>
          </div>`;
        } else {
          const sc = a.side === "Right" ? "r" : "l";
          const done = !!checks[iso];
          rows += `<div class="row row--${sc} ${isToday?"row--today":""} ${done?"row--done":""}"
              data-date="${iso}" role="button" tabindex="0" aria-pressed="${done}">
            <div class="row__day"><span class="row__wd">${fmtWd(iso)}</span><span class="row__dt">${fmtMd(iso)}</span></div>
            <div class="row__mid"><span class="badge badge--${sc}">${a.side === "Right" ? "R" : "L"} &middot; ${a.side} side</span> ${todayTag}</div>
            <div class="row__check"><span class="box ${done?"box--on":""}">${done?"&check;":""}</span></div>
          </div>`;
        }
      }
      list += `<div class="cycle">
        <div class="cycle__head"><span class="cycle__name">Cycle ${c+1}</span>
          <span class="cycle__range">${fmtMd(bA)} &ndash; ${fmtMd(bB)}</span></div>
        <div class="cycle__rows">${rows}</div>
      </div>`;
    }

    app.innerHTML = todayHTML + nextHTML + list;
  }

  // ---- events (bound once) ----
  function wire(){
    const app = document.getElementById("app");
    app.addEventListener("click", e => {
      const el = e.target.closest("[data-date]");
      if(el){ toggle(el.getAttribute("data-date")); }
    });
    app.addEventListener("keydown", e => {
      if(e.key !== "Enter" && e.key !== " ") return;
      const el = e.target.closest("[data-date][role=button]");
      if(el){ e.preventDefault(); toggle(el.getAttribute("data-date")); }
    });

    const gear = document.getElementById("gear");
    const panel = document.getElementById("panel");
    const startInput = document.getElementById("startInput");
    gear.addEventListener("click", () => {
      const show = panel.hasAttribute("hidden");
      if(show){ panel.removeAttribute("hidden"); startInput.value = startISO; }
      else panel.setAttribute("hidden","");
    });
    startInput.addEventListener("change", () => {
      if(!startInput.value) return;
      startISO = startInput.value;
      store.set(KEY_START, startISO);
      render();
    });
    document.getElementById("resetChecks").addEventListener("click", () => {
      if(!window.confirm("Clear every check mark? This can't be undone.")) return;
      checks = {};
      saveChecks();
      render();
    });
  }

  // ---- boot ----
  wire();
  if(!startISO){ renderSetup(); }
  else { showMain(); }
</script>
</body>
</html>
